<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Iniciar sesión</title>
<style>
	body { font-family: sans-serif; background: #f2f4f7; }
	.caja { width: 320px; margin: 80px auto; padding: 25px; background: white;
	        border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
	label, input { display: block; width: 100%; box-sizing: border-box; }
	input { padding: 8px; margin: 5px 0 15px; }
	button { width: 100%; padding: 10px; background: #2c6bed; color: white;
	         border: none; border-radius: 4px; cursor: pointer; }
	.error { background: #fde2e2; color: #b00020; padding: 8px; border-radius: 4px; }
</style>
</head>
<body>
	<div class="caja">
		<h2>Iniciar sesión</h2>

		<!-- Solo aparece si el controlador ha puesto un "error" en el modelo -->
		<p class="error" th:if="${error}" th:text="${error}">Error</p>

		<!-- El formulario hace POST al mismo /login -->
		<form th:action="@{/login}" method="post">
			<label for="usuario">Usuario</label>
			<input type="text" id="usuario" name="usuario" th:value="${usuarioEscrito}" required autofocus>

			<label for="password">Contraseña</label>
			<input type="password" id="password" name="password" required>

			<button type="submit">Entrar</button>
		</form>
	</div>
</body>
</html>
